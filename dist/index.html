<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bd5870">
  <meta name="description" content="查看今日用药安排并记录完成时间">
  <title>用药打卡</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      color-scheme: light;
      --ink: #382f32;
      --muted: #75696d;
      --paper: #fff9f7;
      --surface: #ffffff;
      --rose: #bd5870;
      --rose-dark: #923d53;
      --rose-soft: #f9e2e7;
      --mint: #dff2e8;
      --mint-ink: #246147;
      --line: #eadfe2;
      --shadow: 0 8px 28px rgba(93, 47, 61, 0.09);
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 0%, rgba(249, 226, 231, 0.78), transparent 28rem),
        var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 560px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 18px max(34px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.2;
      letter-spacing: 0.01em;
    }

    .date-nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .edit-plans-button {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--rose-dark);
      font-weight: 720;
      cursor: pointer;
    }

    .reminder-button {
      min-height: 44px;
      padding: 0 13px;
      border: 0;
      border-radius: 999px;
      background: var(--rose-soft);
      color: var(--rose-dark);
      font-weight: 720;
      cursor: pointer;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.82);
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button:active { transform: scale(0.96); }
    .icon-button:focus-visible,
    .check-button:focus-visible,
    .today-button:focus-visible { outline: 3px solid rgba(189, 88, 112, 0.26); outline-offset: 2px; }

    .date-block { margin-top: 28px; }

    .date-line {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .date-title {
      margin: 0;
      font-size: clamp(1.75rem, 8vw, 2.3rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .weekday {
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.93rem;
    }

    .progress-text {
      flex: 0 0 auto;
      padding-bottom: 4px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .progress-text strong { color: var(--rose-dark); font-size: 1.1rem; }

    .progress-track {
      height: 7px;
      margin-top: 16px;
      overflow: hidden;
      border-radius: 999px;
      background: #efe6e8;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--rose), #d98396);
      transition: width 220ms ease;
    }

    .today-button {
      display: none;
      margin: 14px 0 0;
      padding: 8px 13px;
      border: 0;
      border-radius: 999px;
      background: var(--rose-soft);
      color: var(--rose-dark);
      font-weight: 650;
      cursor: pointer;
    }

    .today-button.visible { display: inline-flex; }

    .schedule { margin-top: 28px; }

    .period { margin-top: 28px; }
    .period:first-child { margin-top: 0; }

    .period-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .period-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--rose);
      box-shadow: 0 0 0 5px var(--rose-soft);
    }

    .task-list { display: grid; gap: 10px; }

    .task {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: border-color 180ms ease, background 180ms ease, transform 120ms ease;
    }

    .task.completed {
      border-color: #c8e5d6;
      background: #fbfffc;
      box-shadow: 0 8px 26px rgba(49, 116, 82, 0.07);
    }

    .medicine-name {
      margin: 0;
      font-size: 1rem;
      font-weight: 740;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .medicine-rule {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .medicine-warning {
      margin: 5px 0 0;
      color: #9b5c21;
      font-size: 0.8rem;
      font-weight: 650;
    }

    .check-button {
      min-width: 82px;
      min-height: 48px;
      padding: 9px 12px;
      border: 0;
      border-radius: 14px;
      background: var(--rose);
      color: white;
      font-weight: 760;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 120ms ease, background 180ms ease;
    }

    .check-button:active { transform: scale(0.97); }

    .task.completed .check-button {
      background: var(--mint);
      color: var(--mint-ink);
    }

    .check-time {
      display: block;
      margin-top: 1px;
      font-size: 0.72rem;
      font-weight: 650;
    }

    .empty {
      margin-top: 32px;
      padding: 32px 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      text-align: center;
      box-shadow: var(--shadow);
    }

    .empty-mark {
      width: 50px;
      height: 50px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: var(--mint);
      color: var(--mint-ink);
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .empty h2 { margin: 0; font-size: 1.08rem; }
    .empty p { margin: 6px 0 0; color: var(--muted); font-size: 0.9rem; }

    .editor-dialog {
      width: min(100% - 24px, 560px);
      max-height: min(88vh, 760px);
      margin: auto;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 24px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 24px 70px rgba(71, 38, 48, 0.24);
    }

    .editor-dialog::backdrop {
      background: rgba(54, 39, 44, 0.42);
      backdrop-filter: blur(3px);
    }

    .editor-shell {
      display: flex;
      max-height: min(88vh, 760px);
      flex-direction: column;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .editor-title {
      margin: 0;
      font-size: 1.16rem;
    }

    .editor-close,
    .editor-back {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      border-radius: 50%;
      background: var(--rose-soft);
      color: var(--rose-dark);
      font-size: 1.1rem;
      font-weight: 760;
      cursor: pointer;
    }

    .editor-back { display: none; }
    .editor-back.visible { display: inline-grid; place-items: center; }

    .editor-content {
      overflow-y: auto;
      padding: 16px 18px 22px;
      overscroll-behavior: contain;
    }

    .medicine-editor-list { display: grid; gap: 10px; }

    .medicine-editor-item {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .medicine-editor-item strong,
    .medicine-editor-item span { display: block; }
    .medicine-editor-item strong { font-size: 0.96rem; line-height: 1.4; }
    .medicine-editor-item span { margin-top: 4px; color: var(--muted); font-size: 0.82rem; }

    .plan-form { display: grid; gap: 18px; }

    .field { display: grid; gap: 7px; }
    .field > span,
    .phase-label { font-size: 0.86rem; font-weight: 720; }

    .text-input,
    .date-input,
    .time-input,
    .email-input,
    .password-input {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid #d9cbcf;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .text-input:focus,
    .date-input:focus,
    .time-input:focus,
    .email-input:focus,
    .password-input:focus {
      border-color: var(--rose);
      outline: 3px solid rgba(189, 88, 112, 0.14);
    }

    .phase-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fffbfa;
    }

    .phase-label { margin: 0 0 10px; }

    .date-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .date-grid label { display: grid; gap: 6px; color: var(--muted); font-size: 0.78rem; }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 12px;
    }

    .slot-option {
      position: relative;
      min-width: 0;
    }

    .slot-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .slot-option span {
      min-height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid #dbcdd1;
      border-radius: 11px;
      background: #fff;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .slot-option input:checked + span {
      border-color: var(--rose);
      background: var(--rose-soft);
      color: var(--rose-dark);
    }

    .slot-option input:focus-visible + span { outline: 3px solid rgba(189, 88, 112, 0.18); }

    .form-error {
      min-height: 1.35em;
      margin: -7px 0 0;
      color: #a23b3b;
      font-size: 0.84rem;
    }

    .save-plan-button {
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      background: var(--rose);
      color: #fff;
      font-weight: 760;
      cursor: pointer;
    }

    .reminder-form { display: grid; gap: 15px; }

    .reminder-intro {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .reminder-time-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .reminder-time-grid label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .reminder-status {
      min-height: 1.45em;
      margin: -4px 0 0;
      color: var(--mint-ink);
      font-size: 0.84rem;
    }

    .reminder-status.error { color: #a23b3b; }

    .reminder-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
    }

    .disable-reminder-button {
      min-height: 50px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
    }

    .storage-note {
      margin: 28px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 0.78rem;
    }

    @media (max-width: 380px) {
      .app { padding-inline: 14px; }
      .task { padding: 14px; gap: 10px; }
      .check-button { min-width: 74px; }
      .top-actions { gap: 6px; }
      .edit-plans-button,
      .reminder-button { padding-inline: 10px; font-size: 0.88rem; }
      .date-grid { grid-template-columns: 1fr; }
      .reminder-time-grid { grid-template-columns: 1fr; }
    }

    @media (min-width: 760px) {
      .app { padding-top: 34px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>用药打卡</h1>
      <div class="top-actions">
        <button class="reminder-button" id="openReminder" type="button">提醒</button>
        <button class="edit-plans-button" id="openEditor" type="button">编辑药品</button>
        <nav class="date-nav" aria-label="切换日期">
          <button class="icon-button" id="prevDay" type="button" aria-label="前一天">←</button>
          <button class="icon-button" id="nextDay" type="button" aria-label="后一天">→</button>
        </nav>
      </div>
    </header>

    <section class="date-block" aria-labelledby="dateTitle">
      <div class="date-line">
        <div>
          <h2 class="date-title" id="dateTitle"></h2>
          <div class="weekday" id="weekday"></div>
        </div>
        <div class="progress-text" id="progressText" aria-live="polite"></div>
      </div>
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
      <button class="today-button" id="backToday" type="button">回到今天</button>
    </section>

    <section class="schedule" id="schedule" aria-label="当日用药安排"></section>
    <p class="storage-note">打卡记录仅保存在当前设备</p>
  </main>

  <dialog class="editor-dialog" id="editorDialog" aria-labelledby="editorTitle">
    <div class="editor-shell">
      <header class="editor-header">
        <button class="editor-back" id="editorBack" type="button" aria-label="返回药品列表">←</button>
        <h2 class="editor-title" id="editorTitle">编辑药品</h2>
        <button class="editor-close" id="editorClose" type="button" aria-label="关闭">×</button>
      </header>
      <div class="editor-content" id="editorContent"></div>
    </div>
  </dialog>

  <dialog class="editor-dialog" id="reminderDialog" aria-labelledby="reminderTitle">
    <div class="editor-shell">
      <header class="editor-header">
        <span aria-hidden="true" style="width:44px"></span>
        <h2 class="editor-title" id="reminderTitle">邮件提醒</h2>
        <button class="editor-close" id="reminderClose" type="button" aria-label="关闭">×</button>
      </header>
      <div class="editor-content">
        <form class="reminder-form" id="reminderForm">
          <p class="reminder-intro">每天按北京时间发送早、中、晚、睡前四次提醒。</p>
          <label class="field">
            <span>接收邮箱</span>
            <input class="email-input" name="email" type="email" autocomplete="email" maxlength="120" required placeholder="name@example.com">
          </label>
          <div class="reminder-time-grid">
            <label>早<input class="time-input" name="morning" type="time" value="08:00" required></label>
            <label>中<input class="time-input" name="noon" type="time" value="12:00" required></label>
            <label>晚<input class="time-input" name="evening" type="time" value="18:00" required></label>
            <label>睡前<input class="time-input" name="bedtime" type="time" value="22:00" required></label>
          </div>
          <label class="field">
            <span>提醒设置口令</span>
            <input class="password-input" name="adminKey" type="password" autocomplete="current-password" required placeholder="防止他人修改提醒">
          </label>
          <p class="reminder-status" id="reminderStatus" role="status"></p>
          <div class="reminder-actions">
            <button class="save-plan-button" type="submit">保存提醒</button>
            <button class="disable-reminder-button" id="disableReminder" type="button">关闭提醒</button>
          </div>
        </form>
      </div>
    </div>
  </dialog>

  <script>
    const STORAGE_KEY = "medication-checkin-records-v2";
    const PLAN_STORAGE_KEY = "medication-plans-v2";
    const REMINDER_STORAGE_KEY = "medication-reminder-settings-v2";
    const DATA_RESET_KEY = "medication-source-reset-2026-09-v1";
    const slots = ["早", "午", "晚", "睡前"];
    const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

    const defaultPlans = [
      {
        id: "gatifloxacin",
        name: "加替沙星滴眼液（术前已开）",
        rule: "每天4次 · 9/15–9/21",
        periods: [
          ["2026-09-15", "2026-09-21", slots]
        ]
      },
      {
        id: "tobradex",
        name: "典必殊（妥布霉素地塞米松）滴眼液",
        rule: "每天4次 · 9/15–9/18",
        warning: "激素类用药，严格按医嘱",
        periods: [
          ["2026-09-15", "2026-09-18", slots]
        ]
      },
      {
        id: "fluorometholone",
        name: "氟米龙滴眼液",
        rule: "按阶段减量 · 9/19–10/9",
        warning: "激素类用药，严格按医嘱",
        periods: [
          ["2026-09-19", "2026-09-25", slots],
          ["2026-09-26", "2026-10-02", ["早", "晚"]],
          ["2026-10-03", "2026-10-09", ["睡前"]]
        ]
      },
      {
        id: "vitamin-a-gel",
        name: "维生素A棕阀酸酯眼用凝胶",
        rule: "每晚睡前1次 · 9/15–9/28",
        periods: [
          ["2026-09-15", "2026-09-28", ["睡前"]]
        ]
      },
      {
        id: "artificial-tears",
        name: "人工泪液",
        rule: "每天4次 · 9/29–3/29",
        periods: [
          ["2026-09-29", "2027-03-29", slots]
        ]
      },
      {
        id: "betaxolol",
        name: "盐酸倍他洛尔滴眼液",
        rule: "每晚1次 · 9/15–10/15",
        periods: [
          ["2026-09-15", "2026-10-15", ["睡前"]]
        ]
      }
    ];

    resetUserDataFromSource();
    let plans = loadPlans();

    const scheduleEl = document.getElementById("schedule");
    const dateTitleEl = document.getElementById("dateTitle");
    const weekdayEl = document.getElementById("weekday");
    const progressTextEl = document.getElementById("progressText");
    const progressFillEl = document.getElementById("progressFill");
    const backTodayEl = document.getElementById("backToday");
    const editorDialogEl = document.getElementById("editorDialog");
    const editorContentEl = document.getElementById("editorContent");
    const editorTitleEl = document.getElementById("editorTitle");
    const editorBackEl = document.getElementById("editorBack");
    const reminderDialogEl = document.getElementById("reminderDialog");
    const reminderFormEl = document.getElementById("reminderForm");
    const reminderStatusEl = document.getElementById("reminderStatus");

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function resetUserDataFromSource() {
      if (localStorage.getItem(DATA_RESET_KEY)) return;
      [
        "medication-checkin-records-v1",
        "medication-plans-v1",
        "medication-plan-date-shift-2026-09-v1",
        "medication-reminder-settings-v1",
        STORAGE_KEY,
        PLAN_STORAGE_KEY,
        REMINDER_STORAGE_KEY
      ].forEach((key) => localStorage.removeItem(key));
      localStorage.setItem(DATA_RESET_KEY, "done");
    }

    function loadPlans() {
      try {
        const saved = JSON.parse(localStorage.getItem(PLAN_STORAGE_KEY));
        if (Array.isArray(saved) && saved.length === defaultPlans.length) return saved;
      } catch {}
      return clone(defaultPlans);
    }

    function writePlans() {
      localStorage.setItem(PLAN_STORAGE_KEY, JSON.stringify(plans));
    }

    function localDate(value = new Date()) {
      return new Date(value.getFullYear(), value.getMonth(), value.getDate());
    }

    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function readRecords() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function writeRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function tasksForDate(key) {
      const result = Object.fromEntries(slots.map((slot) => [slot, []]));
      plans.forEach((plan) => {
        plan.periods.forEach(([start, end, activeSlots]) => {
          if (key >= start && key <= end) {
            activeSlots.forEach((slot) => result[slot].push(plan));
          }
        });
      });
      return result;
    }

    function recordId(key, slot, medicineId) {
      return `${key}|${slot}|${medicineId}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    let selectedDate = localDate();

    function render() {
      const key = dateKey(selectedDate);
      const todayKey = dateKey(localDate());
      const grouped = tasksForDate(key);
      const records = readRecords();
      const allTasks = slots.flatMap((slot) => grouped[slot].map((plan) => ({ slot, plan })));
      const completed = allTasks.filter(({ slot, plan }) => records[recordId(key, slot, plan.id)]).length;

      dateTitleEl.textContent = `${selectedDate.getMonth() + 1}月${selectedDate.getDate()}日`;
      weekdayEl.textContent = key === todayKey ? `今天 · ${weekdays[selectedDate.getDay()]}` : weekdays[selectedDate.getDay()];
      progressTextEl.innerHTML = allTasks.length
        ? `<strong>${completed}</strong> / ${allTasks.length}`
        : "无安排";
      progressFillEl.style.width = allTasks.length ? `${(completed / allTasks.length) * 100}%` : "0%";
      backTodayEl.classList.toggle("visible", key !== todayKey);

      if (!allTasks.length) {
        scheduleEl.innerHTML = `
          <div class="empty">
            <div class="empty-mark" aria-hidden="true">✓</div>
            <h2>当天没有用药安排</h2>
            <p>可以切换日期查看其他日期。</p>
          </div>`;
        return;
      }

      scheduleEl.innerHTML = slots
        .filter((slot) => grouped[slot].length)
        .map((slot) => `
          <section class="period" aria-labelledby="period-${slot}">
            <h3 class="period-heading" id="period-${slot}">
              <span class="period-dot" aria-hidden="true"></span>${slot}
            </h3>
            <div class="task-list">
              ${grouped[slot].map((plan) => {
                const id = recordId(key, slot, plan.id);
                const record = records[id];
                return `
                  <article class="task${record ? " completed" : ""}" data-record-id="${escapeHtml(id)}">
                    <div>
                      <h4 class="medicine-name">${escapeHtml(plan.name)}</h4>
                      <p class="medicine-rule">${escapeHtml(plan.rule)}</p>
                      ${plan.warning ? `<p class="medicine-warning">${escapeHtml(plan.warning)}</p>` : ""}
                    </div>
                    <button class="check-button" type="button" data-action="toggle" data-date="${key}" data-slot="${slot}" data-medicine="${plan.id}" aria-pressed="${record ? "true" : "false"}" aria-label="${escapeHtml(plan.name)}${record ? "，取消记录" : "，记录完成"}">
                      ${record ? `已记录<span class="check-time">${escapeHtml(record.time)}</span>` : "记录"}
                    </button>
                  </article>`;
              }).join("")}
            </div>
          </section>`)
        .join("");
    }

    function toggleRecord(key, slot, medicineId) {
      const records = readRecords();
      const id = recordId(key, slot, medicineId);
      if (records[id]) {
        delete records[id];
      } else {
        const now = new Date();
        records[id] = {
          completedAt: now.toISOString(),
          time: now.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false })
        };
      }
      writeRecords(records);
      render();
      return records[id] || null;
    }

    function renderEditorList() {
      editorTitleEl.textContent = "编辑药品";
      editorBackEl.classList.remove("visible");
      editorContentEl.innerHTML = `
        <div class="medicine-editor-list">
          ${plans.map((plan) => `
            <button class="medicine-editor-item" type="button" data-edit-plan="${escapeHtml(plan.id)}">
              <strong>${escapeHtml(plan.name)}</strong>
              <span>${escapeHtml(plan.rule)}</span>
            </button>`).join("")}
        </div>`;
    }

    function renderPlanForm(planId) {
      const plan = plans.find((item) => item.id === planId);
      if (!plan) return;
      editorTitleEl.textContent = "修改用药安排";
      editorBackEl.classList.add("visible");
      editorContentEl.innerHTML = `
        <form class="plan-form" id="planForm" data-plan-id="${escapeHtml(plan.id)}">
          <label class="field">
            <span>药品名称</span>
            <input class="text-input" name="name" type="text" value="${escapeHtml(plan.name)}" maxlength="80" required>
          </label>
          <label class="field">
            <span>用法 / 规格</span>
            <input class="text-input" name="rule" type="text" value="${escapeHtml(plan.rule)}" maxlength="80" required>
          </label>
          <div>
            ${plan.periods.map(([start, end, activeSlots], phaseIndex) => `
              <section class="phase-card" data-phase="${phaseIndex}">
                <p class="phase-label">使用阶段${plan.periods.length > 1 ? ` ${phaseIndex + 1}` : ""}</p>
                <div class="date-grid">
                  <label>开始日期<input class="date-input" name="start-${phaseIndex}" type="date" value="${escapeHtml(start)}" required></label>
                  <label>结束日期<input class="date-input" name="end-${phaseIndex}" type="date" value="${escapeHtml(end)}" required></label>
                </div>
                <div class="slot-grid" aria-label="用药时段">
                  ${slots.map((slot) => `
                    <label class="slot-option">
                      <input type="checkbox" name="slot-${phaseIndex}" value="${slot}" ${activeSlots.includes(slot) ? "checked" : ""}>
                      <span>${slot}</span>
                    </label>`).join("")}
                </div>
              </section>`).join("")}
          </div>
          <p class="form-error" id="formError" role="alert"></p>
          <button class="save-plan-button" type="submit">保存修改</button>
        </form>`;
    }

    function savePlanForm(form) {
      const plan = plans.find((item) => item.id === form.dataset.planId);
      const errorEl = form.querySelector("#formError");
      if (!plan) return;
      const name = form.elements.name.value.trim();
      const rule = form.elements.rule.value.trim();
      const periods = plan.periods.map((_, phaseIndex) => {
        const start = form.elements[`start-${phaseIndex}`].value;
        const end = form.elements[`end-${phaseIndex}`].value;
        const activeSlots = [...form.querySelectorAll(`input[name='slot-${phaseIndex}']:checked`)].map((input) => input.value);
        return [start, end, activeSlots];
      });

      if (!name || !rule) {
        errorEl.textContent = "请填写药品名称和用法。";
        return;
      }
      if (periods.some(([start, end]) => !start || !end || start > end)) {
        errorEl.textContent = "请检查开始和结束日期。";
        return;
      }
      if (periods.some(([, , activeSlots]) => activeSlots.length === 0)) {
        errorEl.textContent = "每个使用阶段至少选择一个时段。";
        return;
      }

      plan.name = name;
      plan.rule = rule;
      plan.periods = periods;
      writePlans();
      render();
      renderEditorList();
    }

    function readReminderSettings() {
      const defaults = { email: "", morning: "08:00", noon: "12:00", evening: "18:00", bedtime: "22:00", enabled: false };
      try {
        return { ...defaults, ...JSON.parse(localStorage.getItem(REMINDER_STORAGE_KEY)) };
      } catch {
        return defaults;
      }
    }

    function fillReminderForm() {
      const settings = readReminderSettings();
      reminderFormEl.elements.email.value = settings.email;
      reminderFormEl.elements.morning.value = settings.morning;
      reminderFormEl.elements.noon.value = settings.noon;
      reminderFormEl.elements.evening.value = settings.evening;
      reminderFormEl.elements.bedtime.value = settings.bedtime;
      reminderFormEl.elements.adminKey.value = "";
      reminderStatusEl.classList.remove("error");
      reminderStatusEl.textContent = settings.enabled ? "提醒已开启，可修改时间或邮箱。" : "";
    }

    function setReminderBusy(busy) {
      [...reminderFormEl.elements].forEach((element) => { element.disabled = busy; });
    }

    async function saveReminderSettings(form) {
      const values = Object.fromEntries(new FormData(form));
      reminderStatusEl.classList.remove("error");
      reminderStatusEl.textContent = "正在保存…";
      setReminderBusy(true);
      try {
        const response = await fetch("/api/reminder-settings", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Reminder-Key": values.adminKey
          },
          body: JSON.stringify({
            email: values.email,
            morning: values.morning,
            noon: values.noon,
            evening: values.evening,
            bedtime: values.bedtime
          })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "保存失败，请稍后重试");
        localStorage.setItem(REMINDER_STORAGE_KEY, JSON.stringify({
          email: values.email,
          morning: values.morning,
          noon: values.noon,
          evening: values.evening,
          bedtime: values.bedtime,
          enabled: true
        }));
        reminderStatusEl.textContent = "已开启四个时段的邮件提醒。";
        form.elements.adminKey.value = "";
      } catch (error) {
        reminderStatusEl.classList.add("error");
        reminderStatusEl.textContent = error.message;
      } finally {
        setReminderBusy(false);
      }
    }

    async function disableReminderSettings() {
      const adminKey = reminderFormEl.elements.adminKey.value;
      if (!adminKey) {
        reminderStatusEl.classList.add("error");
        reminderStatusEl.textContent = "关闭提醒前请输入设置口令。";
        reminderFormEl.elements.adminKey.focus();
        return;
      }
      reminderStatusEl.classList.remove("error");
      reminderStatusEl.textContent = "正在关闭…";
      setReminderBusy(true);
      try {
        const response = await fetch("/api/reminder-settings", {
          method: "DELETE",
          headers: { "X-Reminder-Key": adminKey }
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "关闭失败，请稍后重试");
        const settings = readReminderSettings();
        localStorage.setItem(REMINDER_STORAGE_KEY, JSON.stringify({ ...settings, enabled: false }));
        reminderStatusEl.textContent = "邮件提醒已关闭。";
        reminderFormEl.elements.adminKey.value = "";
      } catch (error) {
        reminderStatusEl.classList.add("error");
        reminderStatusEl.textContent = error.message;
      } finally {
        setReminderBusy(false);
      }
    }

    function moveDay(amount) {
      selectedDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate() + amount);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("prevDay").addEventListener("click", () => moveDay(-1));
    document.getElementById("nextDay").addEventListener("click", () => moveDay(1));
    backTodayEl.addEventListener("click", () => { selectedDate = localDate(); render(); });
    document.getElementById("openEditor").addEventListener("click", () => {
      renderEditorList();
      editorDialogEl.showModal();
    });
    document.getElementById("editorClose").addEventListener("click", () => editorDialogEl.close());
    document.getElementById("openReminder").addEventListener("click", () => {
      fillReminderForm();
      reminderDialogEl.showModal();
    });
    document.getElementById("reminderClose").addEventListener("click", () => reminderDialogEl.close());
    reminderDialogEl.addEventListener("click", (event) => {
      if (event.target === reminderDialogEl) reminderDialogEl.close();
    });
    reminderFormEl.addEventListener("submit", (event) => {
      event.preventDefault();
      saveReminderSettings(event.target);
    });
    document.getElementById("disableReminder").addEventListener("click", disableReminderSettings);
    editorBackEl.addEventListener("click", renderEditorList);
    editorDialogEl.addEventListener("click", (event) => {
      if (event.target === editorDialogEl) editorDialogEl.close();
    });
    editorContentEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-edit-plan]");
      if (button) renderPlanForm(button.dataset.editPlan);
    });
    editorContentEl.addEventListener("submit", (event) => {
      if (event.target.id !== "planForm") return;
      event.preventDefault();
      savePlanForm(event.target);
    });

    scheduleEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action='toggle']");
      if (!button) return;
      toggleRecord(button.dataset.date, button.dataset.slot, button.dataset.medicine);
    });

    render();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
